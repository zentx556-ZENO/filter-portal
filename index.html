<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Portal</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #title{position:fixed;top:14px;left:16px;font-weight:700;font-size:18px;text-shadow:0 2px 8px #000;pointer-events:none}
  #hint{position:fixed;top:48px;left:16px;font-size:14px;color:#e4e4f0;text-shadow:0 2px 8px #000;pointer-events:none}
  #gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
        background:#000;text-align:center;padding:24px}
  #gate h1{margin:0;font-size:clamp(24px,4vw,42px)}
  #gate p{margin:0;max-width:460px;color:#b9b9cc;line-height:1.5}
  #start{font:700 18px Arial;padding:14px 30px;border-radius:999px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer}
  #start:hover,#start:focus-visible{background:#fff;color:#000;outline:none}
  #msg{color:#ff7b9c;min-height:1.4em;max-width:460px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Grid Portal</div>
<div id="hint">Frame something with both hands (thumbs and index fingers)</div>
<div id="gate">
  <h1>Grid Portal</h1>
  <p>Allow camera access, then hold both hands up like a picture frame. Everything inside the frame becomes a white wireframe grid.</p>
  <button id="start">Start camera</button>
  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const video=document.createElement('video'); video.playsInline=true; video.muted=true;
const gate=document.getElementById('gate'), msg=document.getElementById('msg');
let W,H; function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',size); size();

let hands=[], busy=false, lastQuad=null, miss=0;

const model=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+f});
model.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
model.onResults(r=>{hands=r.multiHandLandmarks||[]});

function geo(){const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(W/vw,H/vh);return{vw,vh,s,ox:(W-vw*s)/2,oy:(H-vh*s)/2}}
function P(l){const g=geo();return{x:W-(g.ox+l.x*g.vw*g.s),y:g.oy+l.y*g.vh*g.s}}

// ---- wireframe grid: one lattice vertex per cell, lifted by brightness ----
const lo=document.createElement('canvas'), lx=lo.getContext('2d',{willReadFrequently:true});
let LUM=null, LW=0, LH=0, CELL=14;

function sampleBrightness(){
  CELL=Math.max(10,Math.min(22,Math.round(W/55)));
  LW=Math.ceil(W/CELL)+1; LH=Math.ceil(H/CELL)+1;
  if(lo.width!==LW||lo.height!==LH){lo.width=LW;lo.height=LH}
  const g=geo();
  lx.save(); lx.scale(1/CELL,1/CELL); lx.translate(W,0); lx.scale(-1,1);
  lx.drawImage(video,g.ox,g.oy,g.vw*g.s,g.vh*g.s); lx.restore();
  const d=lx.getImageData(0,0,LW,LH).data;
  if(!LUM||LUM.length!==LW*LH) LUM=new Float32Array(LW*LH);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    const l=(.299*d[i]+.587*d[i+1]+.114*d[i+2])/255;
    LUM[j]=Math.max(0,Math.min(1,(l-.5)*2+.5));          // a little extra contrast
  }
}

function drawGrid(q){
  sampleBrightness();
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  q.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)});
  const pad=2, amp=CELL*3,
        gx0=Math.max(0,Math.floor(x0/CELL)-pad), gx1=Math.min(LW-1,Math.ceil(x1/CELL)+pad),
        gy0=Math.max(0,Math.floor(y0/CELL)-pad), gy1=Math.min(LH-1,Math.ceil(y1/CELL)+pad);
  const X=(gx,l)=>gx*CELL+l*amp*.5, Y=(gy,l)=>gy*CELL-l*amp;
  ctx.beginPath();
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){
    const l=LUM[gy*LW+gx]; gx===gx0?ctx.moveTo(X(gx,l),Y(gy,l)):ctx.lineTo(X(gx,l),Y(gy,l));
  }
  for(let gx=gx0;gx<=gx1;gx++)for(let gy=gy0;gy<=gy1;gy++){
    const l=LUM[gy*LW+gx]; gy===gy0?ctx.moveTo(X(gx,l),Y(gy,l)):ctx.lineTo(X(gx,l),Y(gy,l));
  }
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.lineJoin='round'; ctx.stroke();
}

// ---- drawing ----
function drawVideo(){
  const g=geo(); ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
  ctx.drawImage(video,g.ox,g.oy,g.vw*g.s,g.vh*g.s); ctx.restore();
}
function quadPath(q){ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);for(let i=1;i<4;i++)ctx.lineTo(q[i].x,q[i].y);ctx.closePath()}
function drawPortal(q){
  ctx.save(); quadPath(q); ctx.clip();
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  drawGrid(q);
  ctx.restore();
  quadPath(q); ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2; ctx.lineJoin='round';
  ctx.shadowColor='#fff'; ctx.shadowBlur=10; ctx.stroke(); ctx.shadowBlur=0;
  q.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fillStyle='#fff';ctx.fill()});
}

async function tick(){
  if(video.readyState>=2){
    drawVideo();
    if(!busy){busy=true; try{await model.send({image:video})}catch(e){} busy=false}
    if(hands.length===2){
      const hs=hands.map(h=>h.map(P)).sort((a,b)=>a[0].x-b[0].x), A=hs[0], B=hs[1];
      const raw=[A[4],A[8],B[8],B[4]];
      lastQuad=lastQuad?raw.map((p,i)=>({x:lastQuad[i].x+(p.x-lastQuad[i].x)*.55,y:lastQuad[i].y+(p.y-lastQuad[i].y)*.55})):raw.map(p=>({x:p.x,y:p.y}));
      miss=0;
    } else if(++miss>6) lastQuad=null;
    if(lastQuad) drawPortal(lastQuad);
  }
  requestAnimationFrame(tick);
}

document.getElementById('start').onclick=async()=>{
  msg.textContent='Starting camera…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream; await video.play();
    gate.style.display='none'; tick();
  }catch(e){
    msg.textContent='Camera unavailable. Open this page from an https:// link or http://localhost (not a preview or a content:// file) and allow camera access.';
  }
};
</script>
</body>
</html>
